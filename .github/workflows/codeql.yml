name: CodeQL

on:
  workflow_dispatch:
  # schedule/push/pull_request disabled: CodeQL 对私有仓库需付费 Advanced Security，会失败骚扰
  # push:
  #   branches: ["main-v2"]
  #   paths-ignore:
  #     - 'docs/**'
  #     - 'release-notes/**'
  #     - '*.md'
  # pull_request:
  #   branches: ["main-v2"]
  #   paths-ignore:
  #     - 'docs/**'
  #     - 'release-notes/**'
  #     - '*.md'
  # schedule:
  #   - cron: "27 3 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
