version: 2
project_name: tempora

before:
  hooks:
    - go mod download

builds:
  - id: tempora
    main: ./cmd/tempora
    binary: tempora
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # Inject version identity for `tempora version --verbose/--json` (Integration D/E).
      # buildTimeUTC is the goreleaser run time (UTC), not vcs.time.
      - -s -w -X main.version={{ .Tag }} -X main.gitCommit={{ .ShortCommit }} -X main.buildTimeUTC={{ .Date }} -X tempora/internal/productdocs.linkedVersion={{ .Tag }} -X tempora/internal/productdocs.linkedRevision={{ .Commit }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - id: tempora
    ids: [tempora]
    name_template: "tempora-{{ .Os }}-{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

homebrew_casks:
  - name: tempora
    ids: [tempora]
    # Prereleases (including v*-preview.* and v*-rc*) must not update the stable
    # tap; brew has no separate prerelease channel, so uploading either cask
    # would make it the default `brew install`.
    # npm is a separate line (release-npm.yml, `npm-v*`), so an npm prerelease no
    # longer drags brew along — a stable `v*` cask can ship while npm stays on rc.
    skip_upload: "auto"
    repository:
      owner: madajiann
      name: homebrew-tempora
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/madajiann/Tempora"
    description: "Cache-first DeepSeek coding agent for the terminal."
    commit_author:
      name: tempora
      email: tempora@deepseek.com
    # The CLI archive is not notarized, so the cask still strips quarantine.
    # GoReleaser's hooks field renders the deprecated `postflight do` stanza;
    # emit Homebrew's `postflight_steps` directly until upstream supports it.
    custom_block: |
      postflight_steps do
        if OS.mac?
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/tempora"]
        end
      end

release:
  prerelease: auto
  make_latest: false
  name_template: "Tempora CLI {{ .Tag }}"
