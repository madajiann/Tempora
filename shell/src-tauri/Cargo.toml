[package]
name = "tempora-shell"
version = "0.1.20"
description = "Tempora lightweight Reasonix shell"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 修复：schemars 以 default-features=false 引入 indexmap 1.9，导致 IndexMap
# 失去默认泛型参数（无 std 分支）而编译失败。这里显式补 std 恢复该默认值。
indexmap = { version = "1.9", features = ["std", "serde-1"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1"
# 原生文件夹选择对话框。之前「添加项目」走内核 POST /host/pick-folder，对话框由
# 内核进程(tempora.exe)创建，与可见的 WebView2 窗口分属两个进程——Windows 前台
# 锁让它永远卡在窗口背后，表现为「点了没反应」。这里让壳（与可见窗口同进程）自己
# 打开对话框，创建在 UI 线程上，自然置顶到 Tempora 窗口前台。
rfd = "=0.16.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
